spring.application.name=zonahuella

# Configurar atributos para mi database de MySQL
spring.datasource.url=jdbc:mysql://${PROD_DB_HOST}:3306/${PROD_DB_NAME}
spring.datasource.username=${PROD_DB_USERNAME}
spring.datasource.password=${PROD_DB_PASSWORD}

# Configuracion de la accion JPA
spring.jpa.hibernate.ddl-auto=${PROD_DDL}
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Logs para ver la informacion de las queries de JPA (dev environment)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Hibernate respete los nombres
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl