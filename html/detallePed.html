<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detalle del pedido | Zona Huella</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
        rel="stylesheet"
    >

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Estilos -->
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/detallePed.css">

    <link
        rel="icon"
        type="image/png"
        href="../assets/logo Huella.png"
    >
</head>


<body>

    <!-- NAVBAR -->
    <div id="navbar-container"></div>


    <!-- Breadcrumb -->
    <p class="inPed">

        <a href="../index.html">
            Inicio
        </a>
        Pedido
        <span id="pedido-breadcrumb">
            ...
        </span>

    </p>


    <main>

        <!-- Encabezado -->
        <div class="pedido">

            <h1 id="numero-pedido">
                Cargando pedido...
            </h1>

            <div id="preparation">
                <h1>En preparación</h1>
            </div>

        </div>


        <!-- Fecha -->
        <p
            class="date"
            id="fecha-pedido"
        >
        </p>


        <!-- Mensaje de error -->
        <div
            id="mensaje-error"
            class="alert alert-danger d-none"
            role="alert"
        >
        </div>


        <div class="contenedor-pedido">

            <!-- PRODUCTOS -->
            <section
                class="productos"
                id="lista-productos"
            >

                <!--
                    Los productos serán creados
                    dinámicamente desde detallePed.js
                -->

            </section>


            <!-- SIDEBAR -->
            <div class="sidebar">


                <!-- ENTREGA -->
                <section class="entrega">

                    <div>

                        <h3>Entrega</h3>

                        <h4 id="nombre-cliente">
                            Cargando...
                        </h4>

                        <p id="direccion-entrega">
                        </p>

                        <!--
                            El backend todavía no maneja
                            fecha estimada de entrega.
                        -->
                        <p id="entrega-estimada">
                            Estimado: por confirmar
                        </p>

                    </div>

                </section>


                <!-- RESUMEN -->
                <section class="resumen">

                    <h3>Resumen</h3>

                    <div>

                        <p class="resumenizq">
                            Subtotal
                        </p>

                        <p
                            class="resumender"
                            id="subtotal-pedido"
                        >
                            $0.00
                        </p>


                        <p class="resumenizq">
                            Envío
                        </p>

                        <p class="resumender">
                            Gratis
                        </p>


                        <p class="resumenizq totalp">
                            Total
                        </p>

                        <p
                            class="resumender totalp"
                            id="total-pedido"
                        >
                            $0.00
                        </p>

                    </div>

                </section>

            </div>

        </div>

    </main>


    <!-- FOOTER -->
    <div id="footer-container"></div>


    <!-- Bootstrap -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Componentes comunes -->
    <script src="../js/loadComponents.js"></script>

    <!-- JS de esta página -->
    <script src="../js/detallePed.js"></script>

</body>

</html>
