<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zona Huella - Contáctenos</title>

   <!-- Google Fonts: Rubik & Patrick Hand -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Rubik:wght@300;900&display=swap" rel="stylesheet">

  <!-- Bootstrap con CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Estilos globales y propios -->
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/contactenos.css">
</head>

<body class="d-flex flex-column min-vh-100">

  <!-- NAVBAR-->
  <div id="navbar-container"></div>

  <div class="formato-col">

    <!-- Formulario contáctanos  -->
    <form id="FormContact" action="./submit_page" method="get">
      <h2> ¿Cómo podemos ayudarte?</h2>
      <h3> El equipo de Zona Huella te responderá a la brevedad</h3>
       <fieldset>
        <p class="fullName">
         <label for="name">Nombre*: </label>
           <input type="text" name="name" id="name" required />
         <label for="lastName">Apellido: </label>
           <input type="text" name="apellido" id="apellido" />
        </p>
        <p class="tel-mail">
         <label for="email">Teléfono*:  </label>
           <input type="tel" name="telefono" id="telefono" required />
         <label for="email">Email*:  </label>
           <input type="email" name="email" id="email" placeholder="example@example.com" required />
        </p>
        <p>
         <label for="subject">Asunto*: </label>
           <input type="text" name="subject" id="subject" required />
        </p>
        <p>
         <label for="message">Mensaje*:</label>
           <input type="text" name="message" id="message" placeholder="Escribe tus dudas, comentarios o sugerencias aquí" required/>
         </p>

         <label>
           <input type="checkbox" id="acepto" name="acepto">
         He leído y acepto el 
         <a href="aviso-privacidad.html" target="_blank">Aviso de Privacidad</a>.
         </label>
         <div id="errorAviso" class="error"></div>

        <p>
         <button type="submit"> Enviar </button>
        </p>
       </fieldset>
    </form>
    
    <!--Info de los laterales-->
    <section class="hora-cont">

      <div id="info-card">
        <p> Correo: hola@zonahuella.mx</p>
        <p> Horario de atención: Lun-Vie: 9 a 18 hrs</p>
        <p> Tiempo estimado de respuesta: 24-48 horas</p>
      </div>

      <div id="ayuda-card">
        <a href=""> Envíos y entregas </a>
        <a href=""> Cambios y devoluciones </a>
        <a href=""> Preguntas frecuentes </a>
        <a href=""> Pagos y seguridad </a>
        <a href=""> Cuidado de productos </a>
      </div>
    </section>
  </div>

   <!--FOOTER -->
  <div id="footer-container"></div>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/loadComponents.js"></script>

  <script src="../js/contactenos.js"></script>
</body>
</html>
