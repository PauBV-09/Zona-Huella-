<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Carrito | Zona Huella</title>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="../css/carrito.css" />
		<link rel="stylesheet" href="../css/styles.css" />

		<!-- Bootstrap con CSS -->
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
		<!-- Bootstrap Icons -->
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
		/>
	</head>
	<body>
		<!-- 1. CONTENEDOR NAVBAR (Inyectado y fijado arriba) -->
		<div id="navbar-container"></div>

		<section>
			<!-- Presentacion del producto -->
			<!-- Sección Carrito -->
			<div class="container mt-5">
				<div class="row">
					<!-- Lista de productos -->
					<div class="col-md-8">
						<h3 class="mb-4" style="margin-top: 50px">🛒 Carrito de compras</h3>
						<div id="lista-carrito" class="d-flex flex-column gap-3"></div>
					</div>

					<!-- Total a pagar -->
					<div class="col-md-4" style="margin-top: 108px">
						<div class="card shadow-sm p-3">
							<h4>Total a pagar</h4>
							<p id="total" class="fs-4 fw-bold text-success">$0</p>
							<button class="btn btn-success w-100">Finalizar compra</button>
						</div>
					</div>
				</div>
			</div>
		</section>

		<!-- 3. CONTENEDOR FOOTER -->
		<div id="footer-container"></div>

		<!-- Bootstrap 5 Bundle JS -->
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
		<!-- Inyección de componentes comunes -->
		<script src="../js/loadComponents.js"></script>

		<script src="../js/carrito.js"></script>
	</body>
</html>
