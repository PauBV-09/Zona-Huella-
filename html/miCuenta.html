<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cuenta | Zona Huella</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../css/miCuenta.css" />
  <link rel="stylesheet" href="../css/styles.css" />

  <!-- Bootstrap con CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>

<body>
  <!-- 1. CONTENEDOR NAVBAR (Inyectado y fijado arriba) -->
  <div id="navbar-container"></div>

  <!-- Seccion para contenido de la pagina -->
  <section id="mi_cuenta">
    <nav class="breadcrumb" aria-label="Ruta de navegacion">
      <a href="../index.html">Inicio / </a>
      <span aria-current="page"> Mi cuenta</span>
    </nav>

    <div class="layout">
      <!-- Inicio de la seccion de la barra lateral -->
      <div class="barra_lateral">
        <h2 class="header_barra">Mi Cuenta</h2>
        <div class="formato_barra_lateral">
          <!-- <div class="titulo_barra_lateral">Mi cuenta</div> -->
          <button class="active" data-target="datos">Datos Personales</button>
          <button data-target="direcciones">Direcciones</button>
          <button data-target="perfil">Perfil de Mascota</button>
          <button data-target="favoritos">Favoritos</button>
          <button data-target="pedidos">Mis Pedidos</button>
          <button data-target="sesion">Cerrar sesión</button>
        </div>
      </div>


      <!-- Inicio de la seccion de contenido dependiendo de la barra lateral -->
      <div class="content">
        <div id="datos" class="section">
          <form method="post">
            <h4>Datos Personales</h4>
            <fieldset>
              <div class="name_form_text">
                <div for="name">Nombre: </div>
                <input type="text" name="name" id="name" required class="form_name" />
                <div for="lastName" class="apellido_form">Apellido: </div>
                <input type="text" name="apellido" id="apellido" required class="form_name" />
              </div>
              <div class="mail">
                <div for="email">Email: </div>
                <input type="email" name="email" id="email" placeholder="example@example.com" required
                  class="form_name" />
              </div>
              <p>
                <button type="submit"> Enviar </button>
              </p>
            </fieldset>
          </form>
        </div>
        <div id="direcciones" class="section" style="display: none">
          Contenido de direcciones
        </div>
        <div id="perfil" class="section" style="display: none">
          Contenido de perfil
        </div>
        <div id="favoritos" class="section" style="display: none">
          Contenido de favoritos
        </div>
        <div id="pedidos" class="section" style="display: none">
          Contenido de pedidos
        </div>
        <div id="sesion" class="section" style="display: none">
          Contenido de cerrar sesion
        </div>
      </div>
    </div>
  </section>

  <!-- 3. CONTENEDOR FOOTER -->
  <div id="footer-container"></div>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Inyección de componentes comunes -->
  <script src="../js/loadComponents.js"></script>

  <script src="../js/miCuenta.js"></script>
</body>

</html>
