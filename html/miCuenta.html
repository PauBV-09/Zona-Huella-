<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cuenta | Zona Huella</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../css/miCuenta.css" />
  <link rel="stylesheet" href="../css/styles.css" />

  <!-- Bootstrap con CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="icon" type="image/png" href="../assets/logo Huella.png">
</head>

<body>
  <!-- 1. CONTENEDOR NAVBAR (Inyectado y fijado arriba) -->
  <div id="navbar-container"></div>

  <!-- Seccion para contenido de la pagina -->
  <section id="mi_cuenta">
    <nav class="breadcrumb" aria-label="Ruta de navegacion">
      <a href="../index.html">Inicio / </a>
      <span id="breadcrumb_section" aria-current="page"> Mi cuenta</span>
    </nav>

    <div class="layout">
      <!-- Inicio de la seccion de la barra lateral -->
      <div class="barra_lateral">
        <h2 class="header_barra">Mi Cuenta</h2>
        <div class="formato_barra_lateral">
          <button class="active" data-target="datos">Datos Personales</button>
          <button data-target="direcciones">Direcciones</button>
          <button data-target="perfil_mascota">Perfil de Mascota</button>
          <button data-target="favoritos">Favoritos</button>
          <button data-target="pedidos" onclick="location.href = 'Mispedidos.html'">Mis Pedidos</button>
          <button data-target="sesion">Cerrar sesión</button>
        </div>
      </div>


      <!-- Seccion para datos personales dentro del formato mi cuenta -->
      <div id="datos" class="section">
        <h3 class="titulo_seccion">Datos personales</h3>
        <form method="post">
          <fieldset>
            <div class="form-row two-cols">
              <div class="col">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Escribe aquí" required />
              </div>
              <div class="col">
                <label for="apellidos">Apellidos</label>
                <input type="text" id="apellidos" name="apellidos" placeholder="Escribe aquí" required />
              </div>
            </div>

            <div class="form-row full_width">
              <label for="correo">Correo electrónico</label>
              <input type="email" id="correo" name="correo" placeholder="usuario@correo.com" required />
            </div>

            <div class="form-row two-cols">
              <div class="col">
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" placeholder="Escribe aquí" required />
              </div>
              <div class="col">
                <label for="fecha">Fecha de nacimiento</label>
                <input type="date" id="fecha" name="fecha" required />
              </div>
            </div>

            <div class="form-row boton-row">
              <button type="submit" class="btn-guardar">Guardar cambios</button>
            </div>
          </fieldset>
        </form>
      </div>


      <!-- Seccion para direcciones dentro del formato mi cuenta -->
      <div id="direcciones" class="section" style="display: none">
        <h3 class="titulo_seccion">Direcciones</h3>
        <form method="post">
          <fieldset>
            <div class="form-row two-cols">
              <div class="col">
                <label for="calle">Calle</label>
                <input type="text" id="calle" name="calle" placeholder="Escribe aquí" required />
              </div>
              <div class="col">
                <label for="numero">Numero</label>
                <input type="number" id="numero" name="numero" placeholder="Escribe aquí" required />
              </div>
            </div>

            <div class="form-row two-cols">
              <div class="col">
                <label for="ciudad">Ciudad</label>
                <input type="text" id="ciudad" name="ciudad" placeholder="Escribe aquí" required />
              </div>
              <div class="col">
                <label for="estado">Estado</label>
                <input type="text" id="estado" name="estado" placeholder="Escribe aquí" required />
              </div>
            </div>

            <div class="form-row two-cols">
              <div class="col"><label for="alcaldiaMunicipio">Alcaldía o municipio</label><input id="alcaldiaMunicipio" name="alcaldiaMunicipio" required></div>
              <div class="col"><label for="codigoPostal">Código postal</label><input id="codigoPostal" name="codigoPostal" pattern="[0-9]{5}" maxlength="5" required></div>
            </div>
<div class="form-row boton-row">
              <button type="submit" class="btn-guardar">Guardar cambios</button>
            </div>
          </fieldset>
        </form>
      </div>

      <!-- Seccion para perfil mascota dentro del formato mi cuenta -->
      <div id="favoritos" class="section" style="display: none"><h3 class="titulo_seccion">Favoritos</h3><div id="lista-favoritos"></div></div>
      <div id="perfil_mascota" class="section" style="display: none">
        <h3 class="titulo_seccion">Perfil de Mascota</h3>
        <div class="perfil_mascota_content">
          <label class="picture_mascota pet-photo-upload" for="foto_mascota">
            <input type="file" id="foto_mascota" name="foto_mascota" class="visually-hidden" accept="image/jpeg,image/png" aria-label="Seleccionar foto de tu mascota" aria-describedby="foto_mascota_ayuda" />
            <span class="pet-photo-placeholder" aria-hidden="true">
              <svg viewBox="0 0 64 64" width="64" height="64" fill="currentColor">
                <ellipse cx="13" cy="24" rx="7" ry="10" transform="rotate(-25 13 24)" />
                <ellipse cx="26" cy="14" rx="7" ry="10" />
                <ellipse cx="41" cy="14" rx="7" ry="10" />
                <ellipse cx="53" cy="25" rx="7" ry="10" transform="rotate(25 53 25)" />
                <path d="M32 30c-8 0-11 9-17 15-5 6-2 14 5 14 5 0 8-3 12-3s7 3 12 3c7 0 10-8 5-14-6-6-9-15-17-15z" />
              </svg>
            </span>
            <img id="foto_mascota_preview" alt="Foto de tu mascota" hidden />
            <small id="foto_mascota_ayuda">Selecciona una foto JPG o PNG de hasta 5 MB. Se guardará al pulsar Guardar cambios.</small>
          </label>
          <form method="post">
            <fieldset>
              <div class="form-row two-cols">
                <div class="col">
                  <label for="nombre_mascota">Nombre</label>
                  <input type="text" id="nombre_mascota" name="nombre_mascota" placeholder="Escribe aquí" required />
                </div>
                <div class="col">
                  <label for="especie">Especie</label>
                  <select id="especie" name="especie" required>
                    <option value="" disabled selected>Selecciona una opción</option>
                    <option value="1">Perro</option>
                    <option value="2">Gato</option>
                  </select>
                </div>
              </div>

              <div class="form-row two-cols">
                <div class="col">
                  <label for="edad">Edad</label>
                  <select id="edad" name="edad" required>
                    <option value="" disabled selected>Selecciona una opción</option>
                    <option value="1">Cachorro</option>
                    <option value="2">Adulto Joven</option>
                    <option value="3">Adulto</option>
                    <option value="4">Adulto Avanzado</option>
                  </select>
                </div>
                <div class="col">
                  <label for="tamanio">Tamaño</label>
                  <select id="tamanio" name="tamanio" required>
                    <option value="" disabled selected>Selecciona una opción</option>
                    <option value="1">XS (Extra chico)</option>
                    <option value="2">S (Chico)</option>
                    <option value="3">M (Mediano)</option>
                    <option value="4">L (Grande)</option>
                    <option value="5">XL (Extra Grande)</option>
                  </select>
                </div>
              </div>

              <div class="form-row">
                <label class="recomendaciones_text">
                  <input type="checkbox" id="recomendaciones" name="recomendaciones" />
                  Recibir recomendaciones basadas en mi mascota
                </label>
              </div>

              <div class="form-row boton-row">
                <button type="submit" class="btn-guardar">Guardar cambios</button>
              </div>
            </fieldset>
          </form>
        </div>
      </div>

    </div>
  </section>

  <!-- 3. CONTENEDOR FOOTER -->
  <footer>
    <div id="footer-container"></div>
  </footer>

  <!-- Modal de confirmación cerrar sesión -->
  <div id="modal-cerrar-sesion" class="modal-overlay" style="display: none">
    <div class="modal-box">
      <p class="modal-mensaje">¿Estás seguro de que quieres cerrar sesión?</p>
      <div class="modal-botones">
        <button id="btn-confirmar-si" class="btn-modal btn-si">Sí</button>
        <button id="btn-confirmar-no" class="btn-modal btn-no">No</button>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="../js/api.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Inyección de componentes comunes -->
  <script src="../js/loadComponents.js"></script>

  <script src="../js/miCuenta.js"></script>
  <script src="../js/cuentaApi.js"></script>
  <script src="../js/carrito.js"></script>
</body>

</html>
