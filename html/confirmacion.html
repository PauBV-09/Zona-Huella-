<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zona Huella - Confirmación de compra</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Rubik:wght@300;400;500;600;700;900&display=swap"
        rel="stylesheet"
    >

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- CSS general del proyecto -->
    <link rel="stylesheet" href="../css/styles.css">

    <!-- CSS propio de esta página -->
    <link rel="stylesheet" href="../css/confirmacion.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- NAVBAR COMPARTIDO -->
    <div id="navbar-container"></div>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-grow-1">

        <section class="confirmacion-compra">

            <div class="container">

                <!-- PROGRESO DE COMPRA -->
                <div class="checkout-progress">

                    <div class="progress-line"></div>

                    <div class="checkout-step">
                        <div class="step-circle">1</div>
                        <span>Carrito</span>
                    </div>

                    <div class="checkout-step">
                        <div class="step-circle">2</div>
                        <span>Envío</span>
                    </div>

                    <div class="checkout-step">
                        <div class="step-circle">3</div>
                        <span>Pago</span>
                    </div>

                    <div class="checkout-step">
                        <div class="step-circle">4</div>
                        <span>Confirmación</span>
                    </div>

                </div>


                <!-- MENSAJE DE CONFIRMACIÓN -->
                <div class="confirmation-message text-center">

                    <div class="confirmation-icon">
                        <i class="bi bi-check-lg"></i>
                    </div>

                    <h1>¡Tu pedido está confirmado!</h1>

                    <p>
                        Pedido #ZH-2026-001 · Recibirás una confirmación por correo.
                    </p>

                </div>


                <!-- RESUMEN DE COMPRA -->
                <div class="purchase-summary">

                    <h2>Resumen de compra</h2>

                    <div class="summary-content">

                        <div class="summary-information">

                            <p>
                            1 Pelota azul Petco para perros grandes
                            </p>

                            <p>
                                Dirección: Anor Londo, Catedral principal
                            </p>

                        </div>

                        <div class="summary-total">

                            <span>Total</span>

                            <strong>$1,197.00 Almas</strong>

                        </div>

                    </div>

                </div>


                <!-- BOTONES -->
                <div class="confirmation-actions">

                    <a href="#" class="btn btn-order">
                        Ver mi pedido
                    </a>

                    <a href="#" class="btn btn-continue">
                        Seguir comprando
                    </a>

                </div>

            </div>

        </section>

    </main>

    <!-- FOOTER COMPARTIDO -->
    <div id="footer-container"></div>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Carga navbar y footer -->
    <script src="../js/loadComponents.js"></script>

</body>

</html>
