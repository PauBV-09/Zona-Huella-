<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo producto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Rubik:wght@300;900&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/pagForm.css">
</head>

<body>
    <!-- Estructura general tipo panel administrativo -->
    <div class="layout-admin">
        <aside class="menu-lateral">
            <div class="logo-area">
                <img src="../assets/Logo ZonaHuella blanco0.png" alt="Logo Zona Huella" class="logo-menu">
            </div>
            <p>Administración</p>
            <!-- Menu visual para presentar modulos -->
            <nav>
                <button class="item-menu activo" type="button" data-seccion="nuevo">Nuevo producto</button>
                <button class="item-menu" type="button" data-seccion="gestionar">Gestionar productos</button>
            </nav>
        </aside>

        <main class="panel-contenido">
            <!-- Bloque para crear producto -->
            <section id="nuevo" class="seccion activa">
                <h1>Nuevo producto</h1>
                <p class="subtitulo">Completa los datos para publicar tu producto.</p>

                <form id="formulario-admin-producto" class="row g-3 mt-1">
                    <div class="col-md-6">
                        <label for="nombreProducto" class="form-label">Nombre del producto</label>
                        <input type="text" class="form-control" id="nombreProducto" required>
                    </div>

                    <div class="col-md-6">
                        <label for="marcaProducto" class="form-label">Marca</label>
                        <input type="text" class="form-control" id="marcaProducto" required>
                    </div>

                    <div class="col-md-4">
                        <label for="precioProducto" class="form-label">Precio ($)</label>
                        <input type="number" class="form-control" id="precioProducto" step="0.01" min="0"
                            required>
                    </div>

                    <div class="col-md-4">
                        <label for="stockProducto" class="form-label">Stock disponible</label>
                        <input type="number" class="form-control" id="stockProducto" min="0" required>
                    </div>

                    <div class="col-md-4">
                        <label for="imagenProducto" class="form-label">Imagen Principal</label>
                        <input type="url" class="form-control" id="imagenProducto" required>
                    </div>

                    <div class="col-md-3">
                        <label for="categoriaProducto" class="form-label">Categoría</label>
                        <select id="categoriaProducto" class="form-select" required>
                            <option value="" selected disabled>Selecciona...</option>
                            <option value="alimento">Alimento</option>
                            <option value="higiene">Higiene</option>
                            <option value="juguetes">Juguetes</option>
                            <option value="accesorios">Accesorios</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label for="especieProducto" class="form-label">Especie</label>
                        <select id="especieProducto" class="form-select" required>
                            <option value="" selected disabled>Selecciona...</option>
                            <option value="perro">Perro</option>
                            <option value="gato">Gato</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label for="etapaProducto" class="form-label">Etapa de Vida</label>
                        <select id="etapaProducto" class="form-select" required>
                            <option value="" selected disabled>Selecciona...</option>
                            <option value="cachorro">Cachorro</option>
                            <option value="adulto">Adulto</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label for="tamanoProducto" class="form-label">Tamaño</label>
                        <select id="tamanoProducto" class="form-select" required>
                            <option value="" selected disabled>Selecciona...</option>
                            <option value="chico">Chico</option>
                            <option value="mediano">Mediano</option>
                            <option value="grande">Grande</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <label for="descripcionProducto" class="form-label">Descripción del producto</label>
                        <textarea class="form-control" id="descripcionProducto" rows="3" required></textarea>
                    </div>

                    <div class="col-12 mt-3 text-end">
                        <button type="submit" class="btn btn-principal">Guardar Producto</button>
                    </div>
                </form>
            </section>

            <!-- Bloque visual para gestionar (editar/eliminar) -->
            <section id="gestionar" class="seccion">
                <h1>Gestionar productos</h1>
                <p class="subtitulo">Actualizar o eliminar productos.</p>

                <div class="tabla-contenedor">
                    <table>
                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th>Categoría</th>
                                <th>Precio</th>
                                <th>Stock</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Dog Chow</td>
                                <td>Alimento</td>
                                <td>$30.000</td>
                                <td>20</td>
                                <td>Activo</td>
                                <td>
                                    <button type="button" class="btn-accion editar">Editar</button>
                                    <button type="button" class="btn-accion eliminar">Eliminar</button>
                                </td>
                            </tr>
                            <tr>
                                <td>Arena Premium</td>
                                <td>Higiene</td>
                                <td>$18.000</td>
                                <td>14</td>
                                <td>Activo</td>
                                <td>
                                    <button type="button" class="btn-accion editar">Editar</button>
                                    <button type="button" class="btn-accion eliminar">Eliminar</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="../js/pagForm.js"></script>
</body>
</html>
