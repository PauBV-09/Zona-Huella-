<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo producto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Rubik:wght@300;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/pagForm.css">
</head>

<body>
    <!-- Estructura general tipo panel administrativo -->
    <div class="layout-admin">
        <aside class="menu-lateral">
            <div class="logo-area">
                <img src="../assets/Logo ZonaHuella blanco0.png" alt="Logo Zona Huella" class="logo-menu">
            </div>
            <p>Administración</p>
            <!-- Menu visual para presentar modulos -->
            <nav>
                <button class="item-menu activo" type="button" data-seccion="nuevo">Nuevo producto</button>
                <button class="item-menu" type="button" data-seccion="gestionar">Gestionar productos</button>
            </nav>
        </aside>

        <main class="panel-contenido">
            <!-- Bloque para crear producto -->
            <section id="nuevo" class="seccion activa">
                <h1>Nuevo producto</h1>
                <p class="subtitulo">Completa los datos para publicar tu producto.</p>

                <form class="formulario-producto" action="#" method="post">

                    <label for="nombre">Nombre del producto</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Escribe aqui" required>

                    <div class="fila">
                        <div class="campo">
                            <label for="categoria">Categoría</label>
                            <input type="text" id="categoria" name="categoria" placeholder="Alimento" required>
                        </div>
                        <div class="campo">
                            <label for="especie">Especie</label>
                            <input type="text" id="especie" name="especie" placeholder="Perro" required>
                        </div>
                    </div>

                    <div class="fila">
                        <div class="campo">
                            <label for="precio">Precio</label>
                            <input type="number" id="precio" name="precio" placeholder="0" min="0" required>
                        </div>
                        <div class="campo">
                            <label for="stock">Stock</label>
                            <input type="number" id="stock" name="stock" placeholder="0" min="0" required>
                        </div>
                    </div>

                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" name="descripcion" rows="5"
                        placeholder="Descripción del producto..."></textarea>

                    <div class="fila">
                        <div class="campo">
                            <label for="marca">Marca</label>
                            <input type="text" id="marca" name="marca" placeholder="Escribe aqui">
                        </div>
                        <div class="campo">
                            <label for="imagen">Imagen del producto</label>
                            <input type="file" id="imagen" name="imagen" accept="image/*">
                        </div>
                    </div>

                    <label class="check">
                        <input type="checkbox" name="activo" checked>
                        Producto activo
                    </label>

                    <div class="botones">
                        <button type="reset" class="btn btn-secundario">Borrar</button>
                        <button type="submit" class="btn btn-principal">Publicar</button>
                    </div>
                </form>
            </section>

            <!-- Bloque visual para gestionar (editar/eliminar) -->
            <section id="gestionar" class="seccion">
                <h1>Gestionar productos</h1>
                <p class="subtitulo">Actualizar o eliminar productos.</p>

                <div class="tabla-contenedor">
                    <table>
                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th>Categoría</th>
                                <th>Precio</th>
                                <th>Stock</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Dog Chow</td>
                                <td>Alimento</td>
                                <td>$30.000</td>
                                <td>20</td>
                                <td>Activo</td>
                                <td>
                                    <button type="button" class="btn-accion editar">Editar</button>
                                    <button type="button" class="btn-accion eliminar">Eliminar</button>
                                </td>
                            </tr>
                            <tr>
                                <td>Arena Premium</td>
                                <td>Higiene</td>
                                <td>$18.000</td>
                                <td>14</td>
                                <td>Activo</td>
                                <td>
                                    <button type="button" class="btn-accion editar">Editar</button>
                                    <button type="button" class="btn-accion eliminar">Eliminar</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="../js/pagForm.js"></script>
</body>
</html>
