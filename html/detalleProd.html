<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Producto</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Rubik:wght@300;500;600;700;900&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Estilos globales -->
    <link rel="stylesheet" href="../css/styles.css">

    <!-- Estilos de detalle de producto -->
    <link rel="stylesheet" href="../css/detalleProd.css">
    <link rel="icon" type="image/png" href="../assets/logo Huella.png">
</head>

<body>

    <!-- NAVBAR -->
    <div id="navbar-container"></div>

    <main class="product-detail">
        <nav class="breadcrumb" aria-label="Ruta de navegación">
            <a href="../index.html">Inicio / </a>
            <span id="breadcrumbCategory"></span>
            <span aria-current="page" id="breadcrumbProduct">Detalle de producto</span>
        </nav>

        <!-- Mensaje de carga / error (lo controla detalleProd.js) -->
        <div class="product-status" id="productStatus" role="status">
            <div class="spinner-border" aria-hidden="true"></div>
            <p>Cargando producto...</p>
        </div>

        <!-- Todo el contenido del producto empieza oculto hasta que llegan los datos -->
        <div id="productContent" hidden>

            <section class="main-product">

                <section class="product-gallery">

                    <div class="main-image-container">

                        <button class="gallery-button previous-image" id="prevImage" type="button" aria-label="Imagen anterior">
                            <i class="bi bi-chevron-left" aria-hidden="true"></i>
                        </button>

                        <div class="main-image">
                            <img id="mainProductImage" alt="Imagen principal del producto">
                        </div>

                        <button class="gallery-button next-image" id="nextImage" type="button" aria-label="Imagen siguiente">
                            <i class="bi bi-chevron-right" aria-hidden="true"></i>
                        </button>

                    </div>

                    <!-- Miniaturas: se generan desde JavaScript -->
                    <div class="thumbnail-carousel" id="thumbnailCarousel">

                        <button class="thumbnail-button previous-thumbnail" id="prevThumbnails" type="button" aria-label="Miniaturas anteriores">
                            <i class="bi bi-chevron-left" aria-hidden="true"></i>
                        </button>

                        <div class="thumbnail-list" id="thumbnailList"></div>

                        <button class="thumbnail-button next-thumbnail" id="nextThumbnails" type="button" aria-label="Miniaturas siguientes">
                            <i class="bi bi-chevron-right" aria-hidden="true"></i>
                        </button>

                    </div>

                </section>


                <!-- INFORMACIÓN DEL PRODUCTO -->
                <section class="product-info">

                    <!-- Nombre + favoritos -->
                    <div class="product-header">

                        <div class="product-title">
                            <span class="product-category" id="productCategory"></span>
                            <h1 class="product-name" id="productName"></h1>
                        </div>

                        <button
                            class="fav-btn"
                            type="button"
                            aria-label="Añadir a favoritos"
                            aria-pressed="false"
                        >
                            ♡
                        </button>

                    </div>


                    <!-- Rating -->
                    <div class="product-rating" id="productRatingContainer" hidden>
                        <div class="rating-stars" id="ratingStars" role="img"></div>
                        <span class="rating-value" id="ratingValue"></span>
                        <a class="reviews-link" href="#productReviews" id="reviewsLink"></a>
                    </div>


                    <!-- Precio -->
                    <div class="product-price-container">
                        <p class="product-price" id="productPrice"></p>
                        <span class="stock-status" id="stockStatus"></span>
                    </div>


                    <!-- Descripción breve -->
                    <p class="product-summary" id="productSummary"></p>


                    <div class="product-options" id="productOptions"></div>


                    <!-- Cantidad -->
                    <div class="purchase-controls">

                        <div class="quantity-section">

                            <span class="control-label">Cantidad</span>

                            <div class="quantity-control">

                                <button class="quantity-button" id="decreaseQuantity" type="button" aria-label="Disminuir cantidad">
                                    <i class="bi bi-dash" aria-hidden="true"></i>
                                </button>

                                <span class="product-quantity" id="productQuantity" aria-live="polite">1</span>

                                <button class="quantity-button" id="increaseQuantity" type="button" aria-label="Aumentar cantidad">
                                    <i class="bi bi-plus" aria-hidden="true"></i>
                                </button>

                            </div>

                        </div>


                        <!-- Agregar al carrito -->
                        <button class="add-cart-button" id="addCartButton" type="button">
                            <i class="bi bi-cart-plus" aria-hidden="true"></i>
                            Agregar al carrito
                        </button>

                    </div>


                    <!-- Información adicional -->
                    <div class="purchase-benefits">

                        <div class="benefit">
                            <i class="bi bi-truck" aria-hidden="true"></i>
                            <div>
                                <span class="benefit-title">Entrega disponible</span>
                                <span class="benefit-description">Consulta cobertura y tiempos de entrega.</span>
                            </div>
                        </div>

                        <div class="benefit">
                            <i class="bi bi-shield-check" aria-hidden="true"></i>
                            <div>
                                <span class="benefit-title">Compra segura</span>
                                <span class="benefit-description">Tus datos están protegidos.</span>
                            </div>
                        </div>

                    </div>

                </section>

            </section>


            <!-- INFORMACIÓN DETALLADA (pestañas) -->
            <section class="extra-info">

                <div class="detail-tabs" role="tablist" aria-label="Información del producto">

                    <button
                        class="detail-tab active-tab"
                        id="tabDescripcion"
                        type="button"
                        role="tab"
                        aria-selected="true"
                        aria-controls="panelDescripcion"
                    >
                        Descripción
                    </button>

                    <button
                        class="detail-tab"
                        id="tabDetalles"
                        type="button"
                        role="tab"
                        aria-selected="false"
                        aria-controls="panelDetalles"
                        tabindex="-1"
                    >
                        Detalles
                    </button>

                </div>


                <div class="detail-content">

                    <div
                        class="detail-panel description-content"
                        id="panelDescripcion"
                        role="tabpanel"
                        aria-labelledby="tabDescripcion"
                    >
                        <h2>Sobre este producto</h2>
                        <div id="productDescription"></div>
                    </div>

                    <div
                        class="detail-panel details-preview"
                        id="panelDetalles"
                        role="tabpanel"
                        aria-labelledby="tabDetalles"
                        hidden
                    >
                        <h2>Información destacada</h2>
                        <div id="detailsList"></div>
                    </div>

                </div>

            </section>


            <!-- OPINIONES -->
            <section class="reviews-section" id="productReviews">

                <div class="reviews-header">

                    <div>
                        <span class="section-eyebrow">Experiencias</span>
                        <h2>Opiniones de clientes</h2>
                    </div>

                    <button class="review-button" type="button">
                        Escribir una reseña
                    </button>

                </div>

                <div class="reviews-list" id="reviewsList"></div>

            </section>

        </div>

    </main>


    <!-- FOOTER -->
    <div id="footer-container"></div>


    <!-- Componentes compartidos -->
    <script src="../js/loadComponents.js"></script>

    <!-- JS propio -->
    <script src="../js/detalleProd.js"></script>

</body>

</html>
