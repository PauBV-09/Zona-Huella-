<!DOCTYPE html>
<html lang="es-MX">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Inicio de sesión</title>
 <link rel="stylesheet" href="../css/login.css">
 <link rel="stylesheet" href="../css/styles.css">
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
 <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
 <link rel="icon" type="image/png" href="../assets/logo Huella.png">

</head>
<body>

    <!-- NAVBAR -->
    <div id="navbar-container"></div>

    <div class="background-container">
    <div class="login-container">
        <div class="login-card">
            <div class="login-image">
                <img src="../assets/login.jpg" alt="Ilustración mascota" class="img-login">
            </div>

            <div class="login-form">
                <div class="login-header">
                    <h1 class="login-tittle">Bienvenido de nuevo</h1>
                </div>
                <p class="subtitle">Accede a tu cuenta de Zona Huella</p>

                <form id="loginForm">
                    <div class="input-group">
                        <input type="text" id="username" placeholder="Correo electrónico o usuario" required>
                    </div>
                    <div class="input-group">
                        <input type="password" id="password" placeholder="Contraseña" required autocomplete="new-password">
                    </div>

                    <div class="checkbox-group text-start">
                        <label class="custom-checkbox">
                            <input type="checkbox" id="remember">
                            <span class="checkmark"></span>
                            <span class="checkbox-text">Recuérdame</span>
                        </label>
                    </div>

                    <div class="text-start mb-3">
                        <a href="RecuperacionDeContraseña.html" class="login-link">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="submit" id="btn-submit-login" class="btn-login">Iniciar sesión</button>
                    <button type="button" class="btn-register-link" onclick="location.href='Register.html'">Crea tu cuenta</button>
                </form>
            </div>
        </div>
    </div>
</div>

    <!-- FOOTER -->
    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/login.js"></script> 
    <script src="../js/loadComponents.js"></script> 
</body>
</html>
