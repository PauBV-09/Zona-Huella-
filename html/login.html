<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zona Huella - Inicio de sesión</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>


    <div class="background-container">
        

        <div class="login-card">

            <div class="login-header">
                <div class="logo-placeholder"></div>
                <h2>Zona Huella</h2>
            </div>
            <p class="subtitle">Inicia sesión con tu cuenta</p>

            <form id="loginForm">
                
                <div class="input-group">
                    <input type="text" id="username" placeholder="Nombre de usuario" required>
                </div>

                <div class="input-group">
                    <input type="password" id="password" placeholder="Contraseña" required autocomplete="new-password">
                </div>

                <button type="submit" class="btn-login">Acceder</button>
                <button type="button" class="btn-register-link" onclick="location.href='Register.html'"">Crea tu cuenta</button>
            </form>

        </div>
    </div>

    <script src="../js/login.js"></script>
</body>
</html>
