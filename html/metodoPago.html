<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pago | Zona Huella</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/metodoPago.css">
</head>

<body>

    <!-- Navbar inyectado -->
    <div id="navbar-container"></div>

    <main class="pagina-pago">
        <div class="contenedor-pago">

            <!-- Pasos de la compra -->
            <ol class="pasos-compra" aria-label="Progreso de compra">
                <li class="paso completado">
                    <span class="circulo-paso">1</span>
                    <span class="nombre-paso">Carrito</span>
                </li>

                <li class="paso completado">
                    <span class="circulo-paso">2</span>
                    <span class="nombre-paso">Envío</span>
                </li>

                <li class="paso activo" aria-current="step">
                    <span class="circulo-paso">3</span>
                    <span class="nombre-paso">Pago</span>
                </li>

                <li class="paso">
                    <span class="circulo-paso">4</span>
                    <span class="nombre-paso">Confirmación</span>
                </li>
            </ol>

            <h1>Método de pago</h1>

            <div class="contenido-pago">

                <!-- Formulario visual de pago -->
                <form class="tarjeta-pago">

                    <fieldset class="metodos-pago">
                        <legend class="visually-hidden">
                            Selecciona un método de pago
                        </legend>

                        <label class="opcion-pago">
                            <input type="radio" id="metodo-tarjeta" name="metodo-pago" value="tarjeta" checked>

                            <span>Tarjeta de crédito o débito</span>
                        </label>

                        <label class="opcion-pago">
                            <input type="radio" id="metodo-transferencia" name="metodo-pago" value="transferencia">

                            <span>Transferencia bancaria</span>
                        </label>
                    </fieldset>

                    <div class="datos-tarjeta">

                        <div class="campo">
                            <label for="nombre-tarjeta">
                                Nombre en la tarjeta
                            </label>

                            <input type="text" id="nombre-tarjeta" name="nombreTarjeta" placeholder="Escribe aquí"
                                autocomplete="cc-name">
                        </div>

                        <div class="fila-tarjeta">

                            <div class="campo campo-numero">
                                <label for="numero-tarjeta">
                                    Número de tarjeta
                                </label>

                                <input type="text" id="numero-tarjeta" name="numeroTarjeta"
                                    placeholder="0000 0000 0000 0000" inputmode="numeric" autocomplete="cc-number">
                            </div>

                            <div class="campo">
                                <label for="vencimiento">
                                    Vencimiento
                                </label>

                                <input type="text" id="vencimiento" name="vencimiento" placeholder="MM/AA" maxlength="5"
                                    inputmode="numeric" autocomplete="cc-exp">
                            </div>

                            <div class="campo">
                                <label for="cvv">CVV</label>

                                <input type="text" id="cvv" name="cvv" placeholder="000" maxlength="4"
                                    inputmode="numeric" autocomplete="cc-csc">
                            </div>

                        </div>
                    </div>

                    <div class="datos-transferencia">

                        <div class="encabezado-transferencia">
                            <div class="icono-transferencia">
                                <i class="bi bi-bank2"></i>
                            </div>

                            <div>
                                <h3>Datos para transferencia</h3>
                                <p>Utiliza los siguientes datos para realizar tu pago.</p>
                            </div>
                        </div>

                        <div class="datos-bancarios">

                            <div class="dato-bancario">
                                <span>Banco</span>
                                <strong>Banco Zona Huella</strong>
                            </div>

                            <div class="dato-bancario">
                                <span>Beneficiario</span>
                                <strong>Zona Huella</strong>
                            </div>

                            <div class="dato-bancario">
                                <span>CLABE</span>
                                <strong>012 345 678 901 234 567</strong>
                            </div>

                            <div class="dato-bancario">
                                <span>Referencia</span>
                                <strong>ZH-001197</strong>
                            </div>

                        </div>

                    </div>

                    <label class="aceptar-terminos">
                        <input type="checkbox" name="terminos" checked>
                        <span>Acepto los términos de compra</span>
                    </label>

                    <div class="acciones-pago">
                        <button type="button" class="btn-pagar">
                            Pagar pedido
                            <i class="bi bi-lock-fill"></i>
                        </button>
                    </div>

                </form>

                <!-- Resumen visual del pedido -->
                <aside class="resumen-pedido">
                    <h2>Resumen</h2>

                    <div class="resumen-detalles">
                    </div>

                    <div class="total-pedido">
                        <span>Total</span>
                        <strong></strong>
                    </div>
                </aside>

            </div>
        </div>
    </main>

    <!-- Footer inyectado -->
    <div id="footer-container"></div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Inyección de componentes -->
    <script src="../js/loadComponents.js"></script>

</body>

</html>
